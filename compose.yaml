
services:
  frontend:
    build: ./frontend
    container_name: pos-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: pos-backend
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/pos_mvp
      CLIENT_ORIGIN: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      OWNER_NAME: ${OWNER_NAME:-Shop Owner}
      OWNER_EMAIL: ${OWNER_EMAIL:?Set OWNER_EMAIL in .env}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Set OWNER_PASSWORD in .env}
      DEFAULT_BRANCH_NAME: ${DEFAULT_BRANCH_NAME:-Main Branch}
      NOTIFICATIONS_WORKER_ENABLED: ${NOTIFICATIONS_WORKER_ENABLED:-false}
      NOTIFICATION_MIN_DELAY_MS: ${NOTIFICATION_MIN_DELAY_MS:-6000}
      NOTIFICATION_MAX_DELAY_MS: ${NOTIFICATION_MAX_DELAY_MS:-12000}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
      WAHA_URL: ${WAHA_URL:-http://waha:3000}
      WAHA_API_KEY: ${WAHA_API_KEY:-local-dev-change-me}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      SMS_GATEWAY_URL: ${SMS_GATEWAY_URL:-}
      SMS_GATEWAY_TOKEN: ${SMS_GATEWAY_TOKEN:-}
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_started
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: pos-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  waha:
    image: devlikeapro/waha:latest
    container_name: pos-waha
    profiles: ["notifications"]
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-local-dev-change-me}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-change-this-dashboard-password}
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - waha_sessions:/app/.sessions
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: pos-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - backend
    restart: unless-stopped
  
  grafana:
    image: grafana/grafana:13.3.1
    container_name: pos-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mongo_data:
  prometheus_data:
  grafana_data:
  waha_sessions:
