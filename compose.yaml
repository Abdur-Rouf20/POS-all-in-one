services:
  frontend:
    build: ./frontend
    container_name: pos-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
  backend:
    build: ./backend
    container_name: pos-backend
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/pos_mvp
      CLIENT_ORIGIN: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      OWNER_NAME: ${OWNER_NAME:-Shop Owner}
      OWNER_EMAIL: ${OWNER_EMAIL:?Set OWNER_EMAIL in .env}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Set OWNER_PASSWORD in .env}
      DEFAULT_BRANCH_NAME: ${DEFAULT_BRANCH_NAME:-Main Branch}
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_started
    restart: unless-stopped
  mongo:
    image: mongo:7
    container_name: pos-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
volumes:
  mongo_data:
