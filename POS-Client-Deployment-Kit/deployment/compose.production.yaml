# Requires Docker Compose v2.24.4+ for the !reset merge tag.
# Use with: docker compose -f compose.yaml -f deployment/compose.production.yaml ...
services:
  frontend:
    ports: !reset
      - "${PUBLIC_BIND_IP:-0.0.0.0}:${PUBLIC_HTTP_PORT:-8080}:80"
    restart: unless-stopped

  backend:
    ports: !reset []
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}@mongo:27017/pos_mvp?authSource=admin
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    ports: !reset []
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
